# swagger/paths/studens/{id}/upset.yaml
tags:
  - Contacts
summary:  Patch contact
operationId: upsetContact
description: 'Patch contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  content:
    multipart/from-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
        properties:
          name:
            description: Contact name
            type: string
            example: John Doe
          phoneNumber:
            description: Contact`s phone number
            type: string
            example: +3809634558762
          email:
            description: Contact`s email
            type: string
            example: johndoe123@example.com
          isFavourite:
            description: Is a favourite
            type: boolean
            example: true
            default: false
          contactType:
            description: Personal or work
            type: string
            enum: ["personal","work"]
          photo:
            description: Contact`s photo
            type: string
            format: binary
            example: https://res.cloudinary.com/dgzeqqa8h/image/upload/v1721799310/1721799309977_beautiful-asian-girl-wearing-over-size-hoodie-in-casual-style-ai-generative-photo_f9qajs.jpg
responses:
  '200':
    description: 'Update contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Sucsessfuly update a contact
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: "../../../components/responses/404.yaml"

